# docker-compose.app.yml — deployment com imagem pré-construída (GHCR).
# Usado pelo INSTALAR.bat: pull em segundos, sem build local.
# Para desenvolvimento/build local usa docker-compose.yml.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reparilo
      POSTGRES_PASSWORD: reparilo
      POSTGRES_DB: reparilo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reparilo -d reparilo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/braindeadpt/oficinaos:latest
    restart: unless-stopped
    labels:
      # Only this service is allowed to auto-update (see `watchtower` below).
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reparilo:reparilo@db:5432/reparilo
    volumes:
      - uploads:/app/uploads
      # backup-status.service.ts reads UPLOAD_DIR/backups-status and
      # UPLOAD_DIR/backups — mount the sidecar volumes there so the
      # Settings → Backups indicator sees the heartbeat + dump count.
      - backups-heartbeat:/app/uploads/backups-status
      - backups:/app/uploads/backups

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: reparilo
      PGPASSWORD: reparilo
      PGDATABASE: reparilo
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
      HEARTBEAT_DIR: /backups-status
      # Off-site second destination (rclone). Leave DISABLED without
      # credentials configured; see .env.example.
      BACKUP_REMOTE_ENABLED: "${BACKUP_REMOTE_ENABLED:-false}"
      BACKUP_RCLONE_REMOTE: "${BACKUP_RCLONE_REMOTE:-}"
      RESTORE_CHECK_INTERVAL_DAYS: "${RESTORE_CHECK_INTERVAL_DAYS:-7}"
      # rclone env-var config passes through (RCLONE_CONFIG_*).
    volumes:
      - backups:/backups
      - backups-heartbeat:/backups-status
      - ./scripts/db-backup.sh:/scripts/run-backup.sh:ro
      - ./scripts/db-restore.sh:/scripts/run-restore.sh:ro
      - ./scripts/db-restore-check.sh:/scripts/run-restore-check.sh:ro
    # Daily backup loop: one dump right after start, then every 24h.
    # Installs rclone when the off-site destination is enabled.
    entrypoint:
      - sh
      - -c
      - |
        for i in 1 2 3 4 5; do apk add --no-cache bash >/dev/null 2>&1 && break; sleep 5; done
        if [ "${BACKUP_REMOTE_ENABLED:-false}" = "true" ]; then
          apk add --no-cache rclone >/dev/null 2>&1 || echo '[db-backup] WARN: rclone install failed'
        fi
        while true; do
          bash /scripts/run-backup.sh || echo '[db-backup] failed, retrying tomorrow'
          sleep 86400
        done

  # Automatic updates — OPT-IN. Starts only when the "auto-update" compose
  # profile is active (COMPOSE_PROFILES=auto-update in .env). Pulls a new app
  # image and restarts it on a cron schedule; postgres/db-backup are never
  # touched (label-gated). Migrations run at app start; the daily db-backup
  # dump (14-day retention) is the rollback path — there is no pre-update
  # dump here, unlike ATUALIZAR.bat.
  watchtower:
    image: containrrr/watchtower:latest
    profiles: ["auto-update"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # 6-field cron (sec min hour dom mon dow), in TZ. Default 07:30 —
      # pick a time when the PC is ON and the shop is CLOSED.
      WATCHTOWER_SCHEDULE: "${UPDATE_SCHEDULE:-0 30 7 * * *}"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Optional public HTTPS access via Cloudflare Tunnel — no port-forward,
  # works behind CGNAT. Activate with TUNNEL_TOKEN in .env and
  # COMPOSE_PROFILES including "tunnel" (can combine with "auto-update",
  # comma-separated). Public hostname must point to http://app:4000.
  # Full guide: https://github.com/braindeadpt/OficinaOS/blob/main/docs/remote-access.md
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  backups:
  backups-heartbeat:
