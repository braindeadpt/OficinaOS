services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reparilo
      POSTGRES_PASSWORD: reparilo
      POSTGRES_DB: reparilo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reparilo -d reparilo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reparilo:reparilo@db:5432/reparilo
    volumes:
      - uploads:/app/uploads
      # backup-status.service.ts reads UPLOAD_DIR/backups-status and
      # UPLOAD_DIR/backups — mount the sidecar volumes there so the
      # Settings → Backups indicator sees the heartbeat + dump count.
      - backups-heartbeat:/app/uploads/backups-status
      - backups:/app/uploads/backups

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: reparilo
      PGPASSWORD: reparilo
      PGDATABASE: reparilo
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
      HEARTBEAT_DIR: /backups-status
      # Off-site second destination (rclone). Leave DISABLED without
      # credentials configured; see .env.example.
      BACKUP_REMOTE_ENABLED: "${BACKUP_REMOTE_ENABLED:-false}"
      BACKUP_RCLONE_REMOTE: "${BACKUP_RCLONE_REMOTE:-}"
      RESTORE_CHECK_INTERVAL_DAYS: "${RESTORE_CHECK_INTERVAL_DAYS:-7}"
      # rclone env-var config passes through (RCLONE_CONFIG_*).
    volumes:
      - backups:/backups
      - backups-heartbeat:/backups-status
      - ./scripts/db-backup.sh:/scripts/run-backup.sh:ro
      - ./scripts/db-restore.sh:/scripts/run-restore.sh:ro
      - ./scripts/db-restore-check.sh:/scripts/run-restore-check.sh:ro
    # Daily backup loop: one dump right after start, then every 24h.
    # Installs rclone when the off-site destination is enabled.
    entrypoint:
      - sh
      - -c
      - |
        for i in 1 2 3 4 5; do apk add --no-cache bash >/dev/null 2>&1 && break; sleep 5; done
        if [ "${BACKUP_REMOTE_ENABLED:-false}" = "true" ]; then
          apk add --no-cache rclone >/dev/null 2>&1 || echo '[db-backup] WARN: rclone install failed'
        fi
        while true; do
          bash /scripts/run-backup.sh || echo '[db-backup] failed, retrying tomorrow'
          sleep 86400
        done

  # Optional WhatsApp local transport (Pro module "whatsapp-bot" +
  # disclaimer in Settings). Evolution API v2 (Baileys) with its own
  # Postgres — it never touches the app database. Start with:
  #   docker compose --profile wa-local up -d
  # then set URL http://evolution:8080 + EVOLUTION_API_KEY in Settings.
  evolution:
    image: evoapicloud/evolution-api:v2.3.6
    restart: unless-stopped
    profiles: ["wa-local"]
    depends_on:
      evolution-db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:-}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution}@evolution-db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      STORE_MESSAGES: "false"
      STORE_CONTACTS: "false"
      STORE_CHATS: "false"
      # QR fica válido ~20s e roda sozinho; histórico nunca é importado.
      QRCODE_LIMIT: "30"
      SYNC_FULL_HISTORY: "false"
      LOG_LEVEL: "ERROR"
    expose:
      - "8080"

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["wa-local"]
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution}
      POSTGRES_DB: evolution
    volumes:
      - evolution-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional public HTTPS access via Cloudflare Tunnel — no port-forward,
  # works behind CGNAT. Create the tunnel in Cloudflare Zero Trust, point the
  # public hostname at http://app:4000, set TUNNEL_TOKEN in .env, then:
  #   docker compose --profile tunnel up -d
  # Full guide: docs/remote-access.md
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  backups:
  backups-heartbeat:
  evolution-data:
