name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Package installer & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — package.json version must match the tag
        # Sem isto a v1.0.10 saiu a reportar "1.0.9": o update-check via a
        # versão nova como update disponível e o botão reaplicava o zip
        # para sempre.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json tem $pkg mas a tag é $GITHUB_REF_NAME — bump da version antes de taggar"
            exit 1
          fi

      - name: Build installer bundle
        run: |
          mkdir -p bundle/scripts
          cp INSTALAR.bat INICIAR.bat PARAR.bat ATUALIZAR.bat \
             docker-compose.app.yml .env.example INSTALL.md bundle/
          cp scripts/gerar-env.ps1 scripts/check-virtualization.ps1 \
             scripts/db-backup.sh scripts/db-restore.sh \
             scripts/db-restore-check.sh bundle/scripts/
          cd bundle && zip -r ../oficinaos-install.zip . && cd ..

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --draft: a release so vira "latest" quando TODOS os assets estiverem
          # publicados (job publish). Senao releases/latest/download/ apontava
          # para uma release sem o zip de update durante o build.
          gh release create "${{ github.ref_name }}" oficinaos-install.zip \
            --title "OficinaOS ${{ github.ref_name }}" \
            --generate-notes --draft

  portable:
    name: Build portable Windows bundle (no Docker needed)
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install deps + build app (frontend + prisma client)
        # full install on purpose: the bundle ships node_modules and needs
        # the prisma CLI for `migrate deploy` on first run
        env:
          DATABASE_URL: postgresql://localhost:5432/build
        run: |
          bun install
          bun run build

      - name: Download Bun runtime for Windows
        run: |
          Invoke-WebRequest "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip" -OutFile bun-win.zip
          Expand-Archive bun-win.zip bun-tmp

      - name: Download portable PostgreSQL binaries
        run: |
          Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-17.6-1-windows-x64-binaries.zip" -OutFile pg.zip

      - name: Assemble bundle
        # A app/ do bundle serve tanto para instalar como para o zip de update
        # — por isso leva só deps de produção e sem os pacotes que nunca entram
        # no grafo de imports do servidor (frontend já compilado em dist/,
        # tooling de dev, templates mobile). O prisma CLI fica porque o
        # arranque corre `prisma migrate deploy`.
        env:
          DATABASE_URL: postgresql://localhost:5432/build
        run: |
          $b = "$env:RUNNER_TEMP\oficinaos-portable"
          New-Item -ItemType Directory -Force "$b\app", "$b\bun", "$b\data" | Out-Null
          git archive HEAD -o "$env:RUNNER_TEMP\app.tar"
          tar -xf "$env:RUNNER_TEMP\app.tar" -C "$b\app"
          Push-Location "$b\app"
          bun install --production --ignore-scripts
          Pop-Location
          robocopy dist "$b\app\dist" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy dist falhou: $LASTEXITCODE" }
          robocopy generated "$b\app\generated" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy generated falhou: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          # Pacotes pesados que o servidor nunca importa (verificado abaixo com
          # `bun build` — se uma dep futura passar a ser necessária, o build
          # falha aqui e os artefactos não saem).
          $dead = @(
            '@capacitor', '@electric-sql', '@prisma/query-plan-executor',
            '@testing-library', '@types', '@babel', '@rolldown', '@vitest',
            '@vitejs', '@biomejs', '@fontsource-variable',
            'typescript', 'jsdom', 'lucide-react', 'jspdf', 'jspdf-autotable',
            'html2canvas', 'react', 'react-dom', 'react-router', 'react-i18next',
            'react-markdown', 'remark-gfm', 'rehype-highlight', 'highlight.js',
            'zustand', 'sonner', 'chart.js', 'vitest', 'vite', 'tailwindcss',
            'ultracite', 'husky', 'concurrently', 'lightningcss-win32-x64-msvc',
            'i18next-browser-languagedetector'
          )
          foreach ($d in $dead) {
            Remove-Item (Join-Path "$b\app\node_modules" $d) -Recurse -Force -ErrorAction SilentlyContinue
          }
          # O Prisma client traz o query compiler WASM para todas as BDs —
          # o generated client só importa a variante postgresql.
          Get-ChildItem "$b\app\node_modules\@prisma\client\runtime" -Filter 'query_compiler_*' -File |
            Where-Object { $_.Name -notlike 'query_compiler_fast_bg.postgresql.*' } |
            Remove-Item -Force
          # Prova: o grafo de imports do servidor resolve no node_modules podado.
          Push-Location "$b\app"
          bun build server/index.ts --target bun --outdir "$env:RUNNER_TEMP\server-check"
          if ($LASTEXITCODE -ne 0) { throw "bun build falhou no bundle podado" }
          # Prova: o prisma CLI ainda arranca (start:prod corre migrate deploy).
          bunx prisma migrate deploy --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "prisma migrate deploy falhou no bundle podado" }
          Pop-Location
          # Cache de engines que o prisma CLI baixa ao correr — não vai no zip.
          Remove-Item "$b\app\node_modules\.cache" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item bun-tmp\bun-windows-x64\bun.exe "$b\bun\"
          Expand-Archive pg.zip "$b"
          Copy-Item scripts\portable\* "$b\"
          tar -a -cf oficinaos-portable.zip -C "$env:RUNNER_TEMP" oficinaos-portable

      - name: Smoke test the portable bundle (extract → start → health → stop)
        # 3 releases seguidas saíram com o portátil partido (título vazio,
        # cd em app\, --cwd no sítio errado) sem nenhum passo falhar. Este
        # step extrai o zip real e faz o ciclo completo — falha o job antes
        # de qualquer upload.
        timeout-minutes: 15
        run: |
          $smoke = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          tar -xf oficinaos-portable.zip -C $smoke
          $root = "$smoke\oficinaos-portable"
          # O bsdtar escreve ACLs POSIX-ish que impedem o initdb de fazer
          # chmod 0700 em data\ — /reset repõe as ACLs herdadas do runner.
          icacls $root /reset /t /c /q | Out-Null
          Remove-Item "$root\data" -Recurse -Force -ErrorAction SilentlyContinue
          # O `choice` do autostart assume N em CI (INICIAR.bat `if defined
          # CI`); os `pause` dos caminhos de erro ficam domados com <nul.
          cmd /c "`"$root\INICIAR.bat`" <nul"
          if ($LASTEXITCODE -ne 0) { throw "INICIAR.bat falhou: $LASTEXITCODE" }
          # O INICIAR já esperou pelo /health — reconfirmar de fora.
          $r = Invoke-WebRequest -UseBasicParsing http://localhost:4000/health -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "/health devolveu $($r.StatusCode)" }
          cmd /c "`"$root\PARAR.bat`" <nul"
          Start-Sleep -Seconds 3
          if (Get-Process bun -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -like "$root\*" }) {
            throw "bun continua vivo depois do PARAR.bat"
          }
          & "$root\pgsql\bin\pg_ctl.exe" -D "$root\data" status | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "postgres continua vivo depois do PARAR.bat" }
          $global:LASTEXITCODE = 0

      - name: Build app-update zip + updater asset (in-app updater)
        # O zip de update é exactamente a app\ do bundle — instalação fresca e
        # instalação actualizada ficam sempre com o mesmo conteúdo.
        run: |
          tar -a -cf oficinaos-app-update.zip -C "$env:RUNNER_TEMP\oficinaos-portable" app
          # Formato sha256sum ("hash  ficheiro") — `sha256sum -c` funciona direto.
          $h = (Get-FileHash oficinaos-app-update.zip -Algorithm SHA256).Hash.ToLower()
          "$h  oficinaos-app-update.zip" |
            Out-File -Encoding ascii oficinaos-app-update.zip.sha256
          $h = (Get-FileHash oficinaos-portable.zip -Algorithm SHA256).Hash.ToLower()
          "$h  oficinaos-portable.zip" |
            Out-File -Encoding ascii oficinaos-portable.zip.sha256
          # O updater também sai como asset avulso (+ sha256) — instalações de
          # versões sem o script (v1.0.9) podem fazer o bootstrap manual.
          Copy-Item scripts\update-apply.ps1 update-apply.ps1
          $h = (Get-FileHash update-apply.ps1 -Algorithm SHA256).Hash.ToLower()
          "$h  update-apply.ps1" |
            Out-File -Encoding ascii update-apply.ps1.sha256

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" oficinaos-portable.zip `
            oficinaos-portable.zip.sha256 `
            oficinaos-app-update.zip oficinaos-app-update.zip.sha256 `
            update-apply.ps1 update-apply.ps1.sha256 --clobber

      - name: Share bundle with the installer job
        uses: actions/upload-artifact@v4
        with:
          name: portable-bundle
          path: ${{ runner.temp }}/oficinaos-portable
          retention-days: 1
          # v1.0.9 saiu sem node_modules\.bin (o upload-artifact exclui ficheiros
          # escondidos por defeito) — sem o prisma CLI o serviço crash-loopava.
          include-hidden-files: true

  setup:
    name: Build OficinaOS-Setup.exe (Inno Setup + services)
    runs-on: windows-latest
    needs: portable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: portable-bundle
          path: installer/stage-tmp

      - name: Verify hidden files survived the artifact round-trip
        # Falhava o .bin no caminho artefacto→Setup.exe: sem o prisma CLI
        # o serviço entrava em crash-loop na primeira instalação.
        run: |
          if (-not (Test-Path "installer\stage-tmp\app\node_modules\.bin\prisma*")) {
            throw "o artefacto chegou sem app\node_modules\.bin\prisma — include-hidden-files?"
          }

      - name: Assemble installer stage (app + runtimes + tools)
        run: |
          $s = "installer\stage"
          New-Item -ItemType Directory -Force "$s\app", "$s\bun", "$s\pgsql", "$s\tools" | Out-Null
          robocopy installer\stage-tmp\app "$s\app" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy app falhou: $LASTEXITCODE" }
          robocopy installer\stage-tmp\bun "$s\bun" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy bun falhou: $LASTEXITCODE" }
          robocopy installer\stage-tmp\pgsql "$s\pgsql" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy pgsql falhou: $LASTEXITCODE" }
          Copy-Item installer\setup-service.ps1, installer\backup.ps1, `
            installer\OficinaOS.xml "$s\tools\"
          # robocopy sai 1 em sucesso ("files copied") — resetar senão o step falha
          $global:LASTEXITCODE = 0

      - name: Download WinSW (service wrapper, .NET4 — corre em qualquer Windows)
        run: |
          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET4.exe" `
            -OutFile "installer\stage\tools\OficinaOS.exe"

      - name: Compile tray app (.NET Framework 4 csc — sem deps)
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /nologo `
            /win32icon:"installer\OficinaOS.ico" `
            /out:"installer\stage\tools\OficinaOSTray.exe" `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            installer\tray\OficinaOSTray.cs
          if ($LASTEXITCODE -ne 0) { throw "csc falhou" }

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$v" "/DSourceDir=stage" `
            /Q installer\oficinaos.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/OficinaOS-Setup.exe --clobber
          $h = (Get-FileHash dist/OficinaOS-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  OficinaOS-Setup.exe" |
            Out-File -Encoding ascii dist/OficinaOS-Setup.exe.sha256
          gh release upload "${{ github.ref_name }}" dist/OficinaOS-Setup.exe.sha256 --clobber

  publish:
    name: Publish release (draft until all assets exist)
    runs-on: ubuntu-latest
    needs: [portable, setup]
    # Gate manual: a release só sai de draft depois de aprovação no ambiente
    # "release-publish" — a v1.0.10 publicou-se sozinha antes do E2E na VM.
    environment: release-publish
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # sem checkout neste job — -R resolve o repo senao gh falha com
        # "not a git repository"
        run: gh release edit "${{ github.ref_name }}" --draft=false -R "${{ github.repository }}"
