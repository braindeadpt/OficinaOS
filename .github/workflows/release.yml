name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Package installer & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build installer bundle
        run: |
          mkdir -p bundle/scripts
          cp INSTALAR.bat INICIAR.bat PARAR.bat ATUALIZAR.bat \
             docker-compose.app.yml .env.example INSTALL.md bundle/
          cp scripts/gerar-env.ps1 scripts/check-virtualization.ps1 \
             scripts/db-backup.sh scripts/db-restore.sh \
             scripts/db-restore-check.sh bundle/scripts/
          cd bundle && zip -r ../oficinaos-install.zip . && cd ..

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" oficinaos-install.zip \
            --title "OficinaOS ${{ github.ref_name }}" \
            --generate-notes

  portable:
    name: Build portable Windows bundle (no Docker needed)
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install deps + build app (frontend + prisma client)
        # full install on purpose: the bundle ships node_modules and needs
        # the prisma CLI for `migrate deploy` on first run
        env:
          DATABASE_URL: postgresql://localhost:5432/build
        run: |
          bun install
          bun run build

      - name: Download Bun runtime for Windows
        run: |
          Invoke-WebRequest "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip" -OutFile bun-win.zip
          Expand-Archive bun-win.zip bun-tmp

      - name: Download portable PostgreSQL binaries
        run: |
          Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-17.6-1-windows-x64-binaries.zip" -OutFile pg.zip

      - name: Assemble bundle
        run: |
          $b = "$env:RUNNER_TEMP\oficinaos-portable"
          New-Item -ItemType Directory -Force "$b\app", "$b\bun", "$b\data" | Out-Null
          git archive HEAD -o "$env:RUNNER_TEMP\app.tar"
          tar -xf "$env:RUNNER_TEMP\app.tar" -C "$b\app"
          robocopy node_modules "$b\app\node_modules" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy node_modules falhou: $LASTEXITCODE" }
          robocopy dist "$b\app\dist" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy dist falhou: $LASTEXITCODE" }
          robocopy generated "$b\app\generated" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy generated falhou: $LASTEXITCODE" }
          Copy-Item bun-tmp\bun-windows-x64\bun.exe "$b\bun\"
          Expand-Archive pg.zip "$b"
          Copy-Item scripts\portable\* "$b\"
          tar -a -cf oficinaos-portable.zip -C "$env:RUNNER_TEMP" oficinaos-portable

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" oficinaos-portable.zip --clobber

      - name: Share bundle with the installer job
        uses: actions/upload-artifact@v4
        with:
          name: portable-bundle
          path: ${{ runner.temp }}/oficinaos-portable
          retention-days: 1

  setup:
    name: Build OficinaOS-Setup.exe (Inno Setup + services)
    runs-on: windows-latest
    needs: portable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: portable-bundle
          path: installer/stage-tmp

      - name: Assemble installer stage (app + runtimes + tools)
        run: |
          $s = "installer\stage"
          New-Item -ItemType Directory -Force "$s\app", "$s\bun", "$s\pgsql", "$s\tools" | Out-Null
          robocopy installer\stage-tmp\app "$s\app" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy app falhou: $LASTEXITCODE" }
          robocopy installer\stage-tmp\bun "$s\bun" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy bun falhou: $LASTEXITCODE" }
          robocopy installer\stage-tmp\pgsql "$s\pgsql" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy pgsql falhou: $LASTEXITCODE" }
          Copy-Item installer\setup-service.ps1, installer\backup.ps1, `
            installer\OficinaOS.xml "$s\tools\"

      - name: Download WinSW (service wrapper, .NET4 — corre em qualquer Windows)
        run: |
          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET4.exe" `
            -OutFile "installer\stage\tools\OficinaOS.exe"

      - name: Compile tray app (.NET Framework 4 csc — sem deps)
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /nologo `
            /win32icon:"installer\OficinaOS.ico" `
            /out:"installer\stage\tools\OficinaOSTray.exe" `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            installer\tray\OficinaOSTray.cs
          if ($LASTEXITCODE -ne 0) { throw "csc falhou" }

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$v" "/DSourceDir=stage" `
            /Q installer\oficinaos.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/OficinaOS-Setup.exe --clobber
          (Get-FileHash dist/OficinaOS-Setup.exe -Algorithm SHA256).Hash |
            Out-File -Encoding ascii dist/OficinaOS-Setup.exe.sha256
          gh release upload "${{ github.ref_name }}" dist/OficinaOS-Setup.exe.sha256 --clobber
