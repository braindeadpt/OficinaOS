name: Updater check

# Smoke Windows do updater + instalador. O portable-check monta o bundle mas
# nunca corre o update-apply.ps1 nem compila o .iss — este workflow cobre os
# dois em cada PR que lhes toca, antes de chegarem a uma release.
on:
  pull_request:
    paths:
      - scripts/update-apply.ps1
      - scripts/update-launch.ps1
      - scripts/update-apply.test.ps1
      - installer/oficinaos.iss
      - installer/tray/OficinaOSTray.cs
      - installer/build-windows.ps1
      - .github/workflows/release.yml
      - .github/workflows/updater-check.yml
  workflow_dispatch:

jobs:
  updater:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: update-apply.ps1 — ficheiro bloqueado + rollback (PS 5.1, como em producao)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\update-apply.test.ps1

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Compile oficinaos.iss + tray and verify version metadata
        # Usa o mesmo script da release para validar sintaxe, calculo de versao
        # e o contrato de metadados exigido pela SignPath nos dois .exe.
        run: |
          $s = "installer\stage-ci"
          New-Item -ItemType Directory -Force "$s\app", "$s\bun", "$s\pgsql", "$s\tools", "dist" | Out-Null
          Set-Content "$s\app\stub", "$s\bun\stub", "$s\pgsql\stub", "$s\tools\stub" x
          Set-Content "$s\tools\setup-service.ps1" "param([switch]`$Stop, [switch]`$Uninstall); exit 0"
          .\installer\build-windows.ps1 -Version "v1.2.3-ci" -SourceDir "stage-ci"

      - name: Smoke test rewritten OficinaOS-Setup.exe (install → verify → uninstall)
        # Prova que a normalizacao in-place de VS_VERSION_INFO nao corrompe o
        # loader nem o payload LZMA2 do Inno Setup: instala silenciosamente,
        # confirma os ficheiros extraidos e desinstala.
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "oficinaos-install-smoke"
          $p = Start-Process -FilePath (Resolve-Path "dist\OficinaOS-Setup.exe").Path `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=`"$installDir`"" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "OficinaOS-Setup.exe falhou na instalacao: exit $($p.ExitCode)" }
          foreach ($rel in @("app\stub", "bun\stub", "pgsql\stub", "tools\OficinaOSTray.exe", "OficinaOS.ico", "unins000.exe")) {
            $full = Join-Path $installDir $rel
            if (-not (Test-Path $full)) { throw "Ficheiro em falta apos instalacao: $full" }
          }
          $u = Start-Process -FilePath (Join-Path $installDir "unins000.exe") `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "unins000.exe falhou: exit $($u.ExitCode)" }
