name: Portable check

# Workflow de diagnóstico — corre o mesmo assemble do release.yml mas com
# cada comando nativo em step separado e saída direta (nada capturado em
# variáveis). Existe porque o step "Assemble bundle" morreu 3 releases
# seguidas com 75–90s de silêncio e zero output — sem isto é impossível
# saber qual comando pendura no runner.
on:
  pull_request:
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://localhost:5432/build

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Runtime versions
        run: |
          bun --version
          node --version
          $PSVersionTable.PSVersion

      - name: Install deps + build app
        run: |
          bun install
          bun run build

      - name: Assemble dirs + prune (same list as release.yml)
        run: |
          $b = "$env:RUNNER_TEMP\oficinaos-portable"
          New-Item -ItemType Directory -Force "$b\app" | Out-Null
          git archive HEAD -o "$env:RUNNER_TEMP\app.tar"
          tar -xf "$env:RUNNER_TEMP\app.tar" -C "$b\app"
          Push-Location "$b\app"
          bun install --production --ignore-scripts
          Pop-Location
          robocopy dist "$b\app\dist" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy dist falhou: $LASTEXITCODE" }
          robocopy generated "$b\app\generated" /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy generated falhou: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          $dead = @(
            '@capacitor', '@electric-sql', '@prisma/query-plan-executor',
            '@testing-library', '@types', '@babel', '@rolldown', '@vitest',
            '@vitejs', '@biomejs', '@fontsource-variable',
            'typescript', 'jsdom', 'lucide-react', 'jspdf', 'jspdf-autotable',
            'html2canvas', 'react', 'react-dom', 'react-router', 'react-i18next',
            'react-markdown', 'remark-gfm', 'rehype-highlight', 'highlight.js',
            'zustand', 'sonner', 'chart.js', 'vitest', 'vite', 'tailwindcss',
            'ultracite', 'husky', 'concurrently', 'lightningcss-win32-x64-msvc',
            'i18next-browser-languagedetector'
          )
          foreach ($d in $dead) {
            Remove-Item (Join-Path "$b\app\node_modules" $d) -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem "$b\app\node_modules\@prisma\client\runtime" -Filter 'query_compiler_*' -File |
            Where-Object { $_.Name -notlike 'query_compiler_fast_bg.postgresql.*' } |
            Remove-Item -Force
          Get-Item "$b\app\node_modules\prisma\build\index.js" | Select-Object FullName, Length
          Get-Item "$b\app\node_modules\.bin\prisma*" | Select-Object Name

      - name: Probe A — bun build in pruned bundle
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}\oficinaos-portable\app
        run: |
          Write-Host "MARKER-A-START"
          bun build server/index.ts --target bun --outdir "$env:RUNNER_TEMP\server-check"
          Write-Host "MARKER-A-END EXIT=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "bun build falhou" }

      - name: Probe B — bun version inside bundle dir
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}\oficinaos-portable\app
        run: |
          Write-Host "MARKER-B-START"
          bun --version
          Write-Host "MARKER-B-END EXIT=$LASTEXITCODE"

      - name: Probe C — prisma --version (direct bun)
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}\oficinaos-portable\app
        run: |
          Write-Host "MARKER-C-START"
          bun node_modules\prisma\build\index.js --version
          Write-Host "MARKER-C-END EXIT=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "prisma --version falhou" }

      - name: Probe D — prisma migrate deploy --help (direct bun, DATABASE_URL set)
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}\oficinaos-portable\app
        env:
          CHECKPOINT_DISABLE: "1"
        run: |
          Write-Host "MARKER-D-START"
          bun node_modules\prisma\build\index.js migrate deploy --help
          Write-Host "MARKER-D-END EXIT=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "migrate deploy --help falhou" }

      - name: Probe E — prisma migrate deploy --help (direct bun, no DATABASE_URL)
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}\oficinaos-portable\app
        env:
          DATABASE_URL: ""
          CHECKPOINT_DISABLE: "1"
        run: |
          Write-Host "MARKER-E-START"
          bun node_modules\prisma\build\index.js migrate deploy --help
          Write-Host "MARKER-E-END EXIT=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "migrate deploy --help (sem DATABASE_URL) falhou" }

      - name: Probe F — prisma migrate deploy --help via .bin shim
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}\oficinaos-portable\app
        env:
          CHECKPOINT_DISABLE: "1"
        run: |
          Write-Host "MARKER-F-START"
          & ".\node_modules\.bin\prisma.exe" migrate deploy --help
          Write-Host "MARKER-F-END EXIT=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "shim migrate deploy --help falhou" }

      - name: Probe G — bun run db:migrate-deploy (the real production path)
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}\oficinaos-portable\app
        env:
          CHECKPOINT_DISABLE: "1"
        run: |
          Write-Host "MARKER-G-START"
          bun run db:migrate-deploy
          Write-Host "MARKER-G-END EXIT=$LASTEXITCODE"
          # Corre contra postgres inexistente — falha esperada com P1000,
          # mas tem de imprimir o erro e sair, NÃO pendurar.
