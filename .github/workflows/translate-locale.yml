name: Fill locale translations

on:
  workflow_dispatch:
    inputs:
      lang:
        description: Locale to fill (e.g. es)
        required: true

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Fill missing translations
        run: bun run scripts/fill-locale.ts ${{ inputs.lang }}

      - name: Commit updated locale
        run: |
          if git diff --quiet "src/i18n/locales/${{ inputs.lang }}.json"; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/i18n/locales/${{ inputs.lang }}.json"
          git commit -m "chore(i18n): fill ${{ inputs.lang }} translations [skip ci]"
          git push
